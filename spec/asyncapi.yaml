components:
  messages:
    # Control Frame Messages (Client -> Server)
    incomingPing:
      name: ping
      title: Ping
      summary: Client sends Ping frame (0x9) to elicit Pong from Kalshi
      contentType: application/octet-stream
      payload:
        type: string
        const: ""
      examples:
        - name: emptyPing
          summary: Client sends ping
          payload: ""

    incomingPong:
      name: pong
      title: Pong
      summary: Client replies to Ping with Pong Frame (0xA)
      contentType: application/octet-stream
      payload:
        type: string
        const: ""
      examples:
        - name: emptyPong
          summary: Client sends pong
          payload: ""

    # Command Messages (Client -> Server)
    subscribeCommand:
      name: subscribe
      title: Subscribe Command
      summary: Subscribe to one or more channels
      contentType: application/json
      payload:
        $ref: '#/components/schemas/subscribeCommandPayload'
      examples:
        - name: subscribeToOrderbook
          summary: Subscribe to orderbook_delta for specific market
          payload:
            id: 1
            cmd: subscribe
            params:
              channels: ["orderbook_delta"]
              market_ticker: "CPI-22DEC-TN0.1"
        - name: subscribeMultipleChannels
          summary: Subscribe to multiple channels for multiple markets
          payload:
            id: 2
            cmd: subscribe
            params:
              channels: ["orderbook_delta", "ticker"]
              market_tickers: ["FED-23DEC-T3.00", "CORIVER-2024-T1030"]
        - name: subscribeFillAll
          summary: Subscribe to fill channel for all markets
          payload:
            id: 3
            cmd: subscribe
            params:
              channels: ["fill"]
        - name: subscribeUserOrders
          summary: Subscribe to user_orders channel for specific markets
          payload:
            id: 8
            cmd: subscribe
            params:
              channels: ["user_orders"]
              market_tickers: ["FED-23DEC-T3.00", "CORIVER-2024-T1030"]
        - name: subscribeAllChannelsOneMarket
          summary: Subscribe to market-data channels for one market
          payload:
            id: 4
            cmd: subscribe
            params:
              channels: ["orderbook_delta", "ticker", "trade", "market_lifecycle_v2"]
              market_ticker: "TSLA-23DEC-T200"
        - name: subscribeMarketLifecycle
          summary: Subscribe to market lifecycle events for all markets
          payload:
            id: 5
            cmd: subscribe
            params:
              channels: ["market_lifecycle_v2"]
        - name: subscribeMultivariateMarketLifecycle
          summary: Subscribe to multivariate market lifecycle events for all multivariate markets
          payload:
            id: 15
            cmd: subscribe
            params:
              channels: ["multivariate_market_lifecycle"]
        - name: subscribeCommunications
          summary: Subscribe to communications (RFQs and quotes)
          payload:
            id: 6
            cmd: subscribe
            params:
              channels: ["communications"]
        - name: subscribeTickerWithSnapshot
          summary: Subscribe to ticker with initial snapshot
          payload:
            id: 7
            cmd: subscribe
            params:
              channels: ["ticker"]
              market_tickers: ["FED-23DEC-T3.00"]
              send_initial_snapshot: true
        - name: subscribeCFBenchmarksValue
          summary: Subscribe to cfbenchmarks_value, seeding index IDs
          payload:
            id: 9
            cmd: subscribe
            params:
              channels: ["cfbenchmarks_value"]
              index_ids: ["BRTI", "ETHUSD_RTI"]
        - name: subscribeCFBenchmarksValue5Hz
          summary: Subscribe to the 5Hz CF Benchmarks feed, seeding index IDs
          payload:
            id: 11
            cmd: subscribe
            params:
              channels: ["cfbenchmarks_value_5hz"]
              index_ids: ["BRTI"]
        - name: subscribePythValue
          summary: Subscribe to gold, oil, and natural gas prices on pyth_value
          payload:
            id: 10
            cmd: subscribe
            params:
              channels: ["pyth_value"]
              underlying_tickers: ["Metal.XAU/USD", "Commodities.Index.PYTHOIL/USD", "Commodities.Index.NATGAS/USD"]

    unsubscribeCommand:
      name: unsubscribe
      title: Unsubscribe Command
      summary: Cancel one or more subscriptions
      contentType: application/json
      payload:
        $ref: '#/components/schemas/unsubscribeCommandPayload'
      examples:
        - name: unsubscribeMultiple
          summary: Unsubscribe from multiple subscriptions
          payload:
            id: 124
            cmd: unsubscribe
            params:
              sids: [1, 2]

    listSubscriptionsCommand:
      name: list_subscriptions
      title: List Subscriptions Command
      summary: List all active subscriptions
      contentType: application/json
      payload:
        $ref: '#/components/schemas/listSubscriptionsCommandPayload'
      examples:
        - name: listSubscriptions
          summary: List all active subscriptions
          payload:
            id: 3
            cmd: list_subscriptions

    updateSubscriptionCommand:
      name: update_subscription_add
      title: Update Subscription - Add Markets
      summary: Add markets to an existing subscription
      contentType: application/json
      payload:
        $ref: '#/components/schemas/updateSubscriptionCommandPayload'
      examples:
        - name: addMarkets
          summary: Add markets to subscription
          payload:
            id: 124
            cmd: update_subscription
            params:
              sids: [456]
              market_tickers: ["NEW-MARKET-1", "NEW-MARKET-2"]
              action: add_markets

    updateSubscriptionDeleteCommand:
      name: update_subscription_delete
      title: Update Subscription - Delete Markets
      summary: Remove markets from an existing subscription
      contentType: application/json
      payload:
        $ref: '#/components/schemas/updateSubscriptionCommandPayload'
      examples:
        - name: deleteMarkets
          summary: Remove markets from subscription
          payload:
            id: 125
            cmd: update_subscription
            params:
              sids: [456]
              market_tickers: ["MARKET-TO-REMOVE-1", "MARKET-TO-REMOVE-2"]
              action: delete_markets

    updateSubscriptionGetSnapshotCommand:
      name: update_subscription_get_snapshot
      title: Update Subscription - Get Snapshot
      summary: Request an orderbook snapshot without modifying the subscription
      contentType: application/json
      payload:
        $ref: '#/components/schemas/updateSubscriptionCommandPayload'
      examples:
        - name: getSnapshot
          summary: Request orderbook snapshot for specific markets
          payload:
            id: 127
            cmd: update_subscription
            params:
              sids: [456]
              market_tickers: ["MARKET-1", "MARKET-2"]
              action: get_snapshot

    updateSubscriptionSingleSidCommand:
      name: update_subscription_single_sid
      title: Update Subscription - Single SID Format
      summary: Update subscription using sid parameter instead of sids array
      contentType: application/json
      payload:
        $ref: '#/components/schemas/updateSubscriptionCommandPayload'
      examples:
        - name: addMarketsWithSingleSid
          summary: Add markets using sid instead of sids array
          payload:
            id: 126
            cmd: update_subscription
            params:
              sid: 456
              market_tickers: ["NEW-MARKET-3", "NEW-MARKET-4"]
              action: add_markets

    cfbenchmarksUpdateSubscriptionCommand:
      name: cfbenchmarks_update_subscription
      title: Update Subscription - CF Benchmarks Indices
      summary: Add or remove tracked index IDs, or list available indices, on a cfbenchmarks_value or cfbenchmarks_value_5hz subscription
      contentType: application/json
      payload:
        $ref: '#/components/schemas/cfbenchmarksUpdateSubscriptionCommandPayload'
      examples:
        - name: indexList
          summary: List the available index IDs (does not modify the subscription)
          payload:
            id: 2
            cmd: update_subscription
            params:
              sid: 1
              action: indexlist
        - name: subscribeIndices
          summary: Add index IDs to the subscription
          payload:
            id: 3
            cmd: update_subscription
            params:
              sid: 1
              action: subscribe_indices
              index_ids: ["BRTI"]
        - name: unsubscribeIndices
          summary: Remove index IDs from the subscription
          payload:
            id: 4
            cmd: update_subscription
            params:
              sid: 1
              action: unsubscribe_indices
              index_ids: ["BRTI"]
        - name: subscribeAllIndices
          summary: Receive all available index IDs
          payload:
            id: 5
            cmd: update_subscription
            params:
              sid: 1
              action: subscribe_indices
              index_ids: ["all"]

    pythUpdateSubscriptionCommand:
      name: pyth_update_subscription
      title: Update Subscription - Pyth Underlyings
      summary: Add or remove underlying tickers, or list available underlyings, on a pyth_value subscription
      contentType: application/json
      payload:
        $ref: '#/components/schemas/pythUpdateSubscriptionCommandPayload'
      examples:
        - name: underlyingList
          summary: List recently streamed Pyth underlyings
          payload:
            id: 2
            cmd: update_subscription
            params:
              sid: 1
              action: underlying_list
        - name: subscribeUnderlyings
          summary: Add platinum to the subscription
          payload:
            id: 3
            cmd: update_subscription
            params:
              sid: 1
              action: subscribe_underlyings
              underlying_tickers: ["Metal.XPT/USD"]
        - name: unsubscribeUnderlyings
          summary: Remove platinum from the subscription
          payload:
            id: 4
            cmd: update_subscription
            params:
              sid: 1
              action: unsubscribe_underlyings
              underlying_tickers: ["Metal.XPT/USD"]
        - name: subscribeAllUnderlyings
          summary: Receive every available underlying on the subscription
          payload:
            id: 5
            cmd: update_subscription
            params:
              sid: 1
              action: subscribe_underlyings
              underlying_tickers: ["all"]

    # Response Messages (Server -> Client)
    subscribedResponse:
      name: subscribed
      title: Subscribed Response
      summary: Confirmation that subscription was successful
      contentType: application/json
      payload:
        $ref: '#/components/schemas/subscribedResponsePayload'
      examples:
        - name: subscriptionConfirmed
          summary: Subscription confirmed
          payload:
            id: 1
            type: subscribed
            msg:
              channel: orderbook_delta
              sid: 1

    unsubscribedResponse:
      name: unsubscribed
      title: Unsubscribed Response
      summary: Confirmation that unsubscription was successful
      contentType: application/json
      payload:
        $ref: '#/components/schemas/unsubscribedResponsePayload'
      examples:
        - name: unsubscriptionConfirmed
          summary: Unsubscription confirmed
          payload:
            id: 102
            sid: 2
            seq: 7
            type: unsubscribed

    subscribedIndicesResponse:
      name: ok
      title: Subscribed Indices
      summary: Current CF Benchmarks index filter after an update; all-mode is ["all"]
      contentType: application/json
      payload:
        $ref: '#/components/schemas/subscribedIndicesResponsePayload'

    subscribedUnderlyingsResponse:
      name: ok
      title: Subscribed Underlyings
      summary: Current Pyth underlying ticker filter after an update; all-mode is ["all"]
      contentType: application/json
      payload:
        $ref: '#/components/schemas/subscribedUnderlyingsResponsePayload'

    okResponse:
      name: ok
      title: OK Response
      summary: Successful update operation response
      contentType: application/json
      payload:
        $ref: '#/components/schemas/okResponsePayload'
      examples:
        - name: updateSuccess
          summary: Update subscription success
          payload:
            id: 123
            sid: 456
            seq: 222
            type: ok
            msg:
              market_tickers: ["MARKET-1", "MARKET-2", "MARKET-3"]

    listSubscriptionsResponse:
      name: list_subscriptions
      title: List Subscriptions Response
      summary: Response containing all active subscriptions
      contentType: application/json
      payload:
        $ref: '#/components/schemas/listSubscriptionsResponsePayload'
      examples:
        - name: listSubscriptionsResponse
          summary: List of active subscriptions
          payload:
            id: 3
            type: ok
            msg:
              - channel: "orderbook_delta"
                sid: 1
              - channel: "ticker"
                sid: 2
              - channel: "fill"
                sid: 3

    errorResponse:
      name: error
      title: Error Response
      summary: Error response for failed operations
      description: |
        Error responses are sent when a command fails. Each error includes a numeric code and a human-readable message.

        ## Error Codes Reference

        | Code | Error | Description |
        |------|-------|-------------|
        | 1 | Unable to process message | General processing error |
        | 2 | Params required | Missing params object in command |
        | 3 | Channels required | Missing channels array in subscribe |
        | 4 | Subscription IDs required | Missing sids in unsubscribe |
        | 5 | Unknown command | Invalid command name |
        | 6 | Retired | Not emitted. The number stays reserved. |
        | 7 | Unknown subscription ID | Subscription ID not found |
        | 8 | Unknown channel name | Invalid channel in subscribe |
        | 9 | Authentication required | Channel requires authenticated connection |
        | 10 | Channel error | Channel-specific error |
        | 11 | Invalid parameter | Malformed parameter value |
        | 12 | Exactly one subscription ID is required | For update_subscription |
        | 13 | Unsupported action | Invalid action for update_subscription |
        | 14 | Market Ticker required | Missing market specification (market_ticker or market_id) |
        | 15 | Action required | Missing action in update_subscription |
        | 16 | Retired | Not emitted. The number stays reserved. |
        | 17 | Retired | Not emitted. The number stays reserved. |
        | 18 | Command timeout | Server timed out while processing command |
        | 19 | shard_factor must be > 0 | Invalid shard_factor |
        | 20 | shard_factor is required when shard_key is set | Missing shard_factor when shard_key is set |
        | 21 | shard_key must be >= 0 and < shard_factor | Invalid shard_key |
        | 22 | shard_factor must be <= 100 | shard_factor too large |
        | 23 | Match IDs required | Missing match_ids for the channel/action |
        | 24 | Index IDs required | Missing index_ids for subscribe_indices/unsubscribe_indices on cfbenchmarks_value / cfbenchmarks_value_5hz |
        | 25 | Subscription buffer overflow | The subscription's outbound buffer was exceeded |
        | 26 | Subscription market limit exceeded | Adding markets would exceed the per-subscription market limit |
        | 27 | Too many requests | The subscription exceeded its command rate limit |
        | 28 | Underlying tickers required | Missing underlying_tickers for subscribe_underlyings/unsubscribe_underlyings on pyth_value |
      contentType: application/json
      payload:
        $ref: '#/components/schemas/errorResponsePayload'
      examples:
        - name: unknownSubscription
          summary: Unknown subscription ID error
          payload:
            id: 123
            type: error
            msg:
              code: 7
              msg: "Unknown subscription ID"
        - name: unknownChannel
          summary: Unknown channel error
          payload:
            id: 124
            type: error
            msg:
              code: 8
              msg: "Unknown channel name"
        - name: paramsRequired
          summary: Missing params object
          payload:
            id: 125
            type: error
            msg:
              code: 2
              msg: "Params required"
        - name: authenticationRequired
          summary: Channel requires authenticated connection
          payload:
            id: 126
            type: error
            msg:
              code: 9
              msg: "Authentication required"
        - name: marketTickerRequired
          summary: Missing market ticker
          payload:
            id: 127
            type: error
            msg:
              code: 14
              msg: "Market Ticker required"

