              description: Last traded price in dollars
            yes_bid_dollars:
              type: string
              description: Best bid price for yes side in dollars
            yes_ask_dollars:
              type: string
              description: Best ask price for yes side in dollars
            volume_fp:
              type: string
              description: Fixed-point total contracts traded (2 decimals)
            open_interest_fp:
              type: string
              description: Fixed-point open interest (2 decimals)
            dollar_volume:
              type: integer
              description: Signed whole-dollar cumulative traded notional
            dollar_open_interest:
              type: integer
              description: Signed whole-dollar open-interest notional
            yes_bid_size_fp:
              type: string
              description: Fixed-point contracts at best bid (2 decimals)
            yes_ask_size_fp:
              type: string
              description: Fixed-point contracts at best ask (2 decimals)
            last_trade_size_fp:
              type: string
              description: Fixed-point contracts in last trade (2 decimals)
            ts:
              type: integer
              deprecated: true
              description: Deprecated - Unix timestamp for when the update happened (in seconds). Use ts_ms instead.
              format: int64
            ts_ms:
              type: integer
              description: Unix timestamp for when the update happened (in milliseconds)
              format: int64
            time:
              type: string
              deprecated: true
              description: Deprecated - Timestamp for when the update happened (RFC3339). Use ts_ms instead.
              format: date-time

    tradePayload:
      type: object
      required: ["type", "sid", "seq", "msg"]
      properties:
        type:
          type: string
          const: "trade"
        sid:
          $ref: '#/components/schemas/subscriptionId'
        seq:
          $ref: '#/components/schemas/sequenceNumber'
        msg:
          type: object
          required: ["trade_id", "market_ticker", "yes_price_dollars", "no_price_dollars", "count_fp", "taker_side", "taker_outcome_side", "taker_book_side", "is_block_trade", "ts", "ts_ms"]
          properties:
            trade_id:
              type: string
              description: Unique identifier for the trade
              format: uuid
            market_ticker:
              $ref: '#/components/schemas/marketTicker'
            yes_price_dollars:
              type: string
              description: Yes side price in dollars
            no_price_dollars:
              type: string
              description: No side price in dollars
            count_fp:
              type: string
              description: Fixed-point contracts traded (2 decimals)
            taker_side:
              $ref: '#/components/schemas/marketSide'
              deprecated: true
              description: |
                Deprecated. Use `taker_outcome_side` (or `taker_book_side`) instead. See [Order direction](/getting_started/order_direction). This field will not be removed before May 14, 2026.
            taker_outcome_side:
              $ref: '#/components/schemas/marketSide'
              description: |
                The outcome side the taker is positioned for. buy-yes and sell-no produce 'yes'; buy-no and sell-yes produce 'no'.

                `taker_outcome_side` describes directional exposure only; it does not change the trade's price. A trade at price `p` with `taker_outcome_side=no` is matched against the maker at the same price `p` with the opposite direction — both parties trade at the same price.

                `taker_outcome_side` and `taker_book_side` will become the canonical way to determine trade direction. The legacy `taker_side` field will be deprecated in a future release — please migrate to these new fields.
            taker_book_side:
              $ref: '#/components/schemas/bookSide'
              description: |
                Same directional bit as taker_outcome_side in book vocabulary. 'bid' is equivalent to taker_outcome_side 'yes'; 'ask' is equivalent to taker_outcome_side 'no'.

                `taker_outcome_side` and `taker_book_side` will become the canonical way to determine trade direction. The legacy `taker_side` field will be deprecated in a future release — please migrate to these new fields.
            is_block_trade:
              type: boolean
              description: True if the trade was matched off book as a block trade
            ts:
              type: integer
              deprecated: true
              description: Deprecated - Unix timestamp in seconds. Use ts_ms instead.
              format: int64
            ts_ms:
              type: integer
              description: Unix timestamp in milliseconds
              format: int64

    fillPayload:
      type: object
      required: ["type", "sid", "msg"]
      properties:
        type:
          type: string
          const: "fill"
        sid:
          $ref: '#/components/schemas/subscriptionId'
        msg:
          type: object
          required: ["trade_id", "order_id", "market_ticker", "exchange_index", "is_taker", "side", "yes_price_dollars", "count_fp", "fee_cost", "action", "outcome_side", "book_side", "ts", "ts_ms", "post_position_fp", "purchased_side"]
          properties:
            trade_id:
              type: string
