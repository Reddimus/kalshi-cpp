asyncapi: 3.0.0
info:
  title: Kalshi Market Data WebSocket API
  version: 2.0.0
  description: |
    WebSocket API for receiving real-time market data notifications and updates on Kalshi.

    This API provides multiple channels of information over a single connection. After establishing
    a WebSocket connection, clients can subscribe to specific channels and markets of interest.

    All messages are encoded in JSON format and the communication is asynchronous.

    ## Error Codes Reference

    When a command fails, the server responds with an error message containing a numeric code:

    | Code | Error | Description |
    |------|-------|-------------|
    | 1 | Unable to process message | General processing error |
    | 2 | Params required | Missing params object in command |
    | 3 | Channels required | Missing channels array in subscribe |
    | 4 | Subscription IDs required | Missing sids in unsubscribe |
    | 5 | Unknown command | Invalid command name |
    | 6 | Retired | Not emitted. The number stays reserved. |
    | 7 | Unknown subscription ID | Subscription ID not found |
    | 8 | Unknown channel name | Invalid channel in subscribe |
    | 9 | Authentication required | Channel requires authenticated connection |
    | 10 | Channel error | Channel-specific error |
    | 11 | Invalid parameter | Malformed parameter value |
    | 12 | Exactly one subscription ID is required | For update_subscription |
    | 13 | Unsupported action | Invalid action for update_subscription |
    | 14 | Market Ticker required | Missing market specification (market_ticker or market_id) |
    | 15 | Action required | Missing action in update_subscription |
    | 16 | Retired | Not emitted. The number stays reserved. |
    | 17 | Retired | Not emitted. The number stays reserved. |
    | 18 | Command timeout | Server timed out while processing command |
    | 19 | shard_factor must be > 0 | Invalid shard_factor |
    | 20 | shard_factor is required when shard_key is set | Missing shard_factor when shard_key is set |
    | 21 | shard_key must be >= 0 and < shard_factor | Invalid shard_key |
    | 22 | shard_factor must be <= 100 | shard_factor too large |
    | 26 | Subscription market limit exceeded | Adding markets would exceed the per-subscription market limit |
    | 27 | Too many requests | The subscription exceeded its command rate limit |
    | 28 | Underlying tickers required | Missing underlying_tickers for subscribe_underlyings/unsubscribe_underlyings on pyth_value |

    ## Terminal Errors

    The following channel errors are terminal and the user must resubscribe.

    | Code | Error |
    |------|-------|
    | 10 | Channel error |
    | 25 | Subscription buffer overflow |
  contact:
    name: Kalshi Support
    url: https://kalshi.com
    email: support@kalshi.com
  license:
    name: Proprietary
    url: https://kalshi.com/terms
  tags:
    - name: control-frames
      description: WebSocket control frames for connection management
    - name: commands
      description: Client-to-server command messages
    - name: responses
      description: Server responses to commands
    - name: market-data
      description: Real-time market data updates
    - name: private
      description: Private/authenticated data channels

servers:
  production:
    host: external-api-ws.kalshi.com
    pathname: /trade-api/ws/v2
    protocol: wss
    description: Production Trade API WebSocket server (encrypted connection only)
    security:
      - $ref: '#/components/securitySchemes/apiKey'

defaultContentType: application/json

channels:
  root:
    address: /
    title: WebSocket Connection
    description: |
      Main WebSocket connection endpoint. All communication happens through this single connection.
      Authentication is required to establish the connection; include API key headers during the WebSocket handshake.
      Some channels carry only public market data, but the connection itself still requires authentication.
      Use the subscribe command to subscribe to specific data channels. For more information, see the [Getting Started](https://docs.kalshi.com/getting_started/quick_start_websockets) guide.
    bindings:
      ws:
        method: GET
    messages:
      # Commands (Client -> Server)
      subscribeCommand:
        $ref: '#/components/messages/subscribeCommand'
      unsubscribeCommand:
        $ref: '#/components/messages/unsubscribeCommand'
      updateSubscriptionCommand:
        $ref: '#/components/messages/updateSubscriptionCommand'
      updateSubscriptionDeleteCommand:
        $ref: '#/components/messages/updateSubscriptionDeleteCommand'
      updateSubscriptionSingleSidCommand:
        $ref: '#/components/messages/updateSubscriptionSingleSidCommand'
      cfbenchmarksUpdateSubscriptionCommand:
        $ref: '#/components/messages/cfbenchmarksUpdateSubscriptionCommand'
      pythUpdateSubscriptionCommand:
        $ref: '#/components/messages/pythUpdateSubscriptionCommand'
      listSubscriptionsCommand:
        $ref: '#/components/messages/listSubscriptionsCommand'
      # Responses (Server -> Client)
      subscribedResponse:
        $ref: '#/components/messages/subscribedResponse'
      listSubscriptionsResponse:
        $ref: '#/components/messages/listSubscriptionsResponse'
      unsubscribedResponse:
        $ref: '#/components/messages/unsubscribedResponse'
      subscribedIndicesResponse:
        $ref: '#/components/messages/subscribedIndicesResponse'
      subscribedUnderlyingsResponse:
        $ref: '#/components/messages/subscribedUnderlyingsResponse'
      okResponse:
        $ref: '#/components/messages/okResponse'
      errorResponse:
        $ref: '#/components/messages/errorResponse'

  control_frames:
    address: /
    title: Connection Keep-Alive
    description: |
      WebSocket control frames for connection management.

      Kalshi sends Ping frames (`0x9`) every 10 seconds with body `heartbeat` to maintain the connection.
      Clients should respond with Pong frames (`0xA`). Clients may also send Ping frames to which Kalshi will respond with Pong.
    messages:
      incomingPing:
        $ref: '#/components/messages/incomingPing'
      incomingPong:
        $ref: '#/components/messages/incomingPong'
      outgoingPing:
        $ref: '#/components/messages/outgoingPing'
      outgoingPong:
        $ref: '#/components/messages/outgoingPong'

  orderbook_delta:
    address: orderbook_delta
    title: Orderbook Updates
    description: |
      Real-time orderbook price level changes. Provides incremental updates to maintain a live orderbook.

      **Requirements:**
      - Authentication required
      - Market specification required:
        - Use `market_ticker` (string) for a single market
        - Use `market_tickers` (array of strings) for multiple markets
        - `market_id`/`market_ids` are not supported for this channel
      - Sends `orderbook_snapshot` first, then incremental `orderbook_delta` updates
      - Supports `update_subscription` with `add_markets` / `delete_markets` / `get_snapshot` actions
      - `get_snapshot` returns an `orderbook_snapshot` for the requested `market_tickers` without modifying the subscription

      **Use case:** Building and maintaining a real-time orderbook
    messages:
      orderbookSnapshot:
        $ref: '#/components/messages/orderbookSnapshot'
      orderbookDelta:
        $ref: '#/components/messages/orderbookDelta'

  ticker:
    address: ticker
    title: Market Ticker
    description: |
      Market price, volume, and open interest updates.

      **Requirements:**
      - No additional channel-level authentication beyond the authenticated WebSocket connection
      - Market specification optional (omit to receive all markets)
      - Supports `market_ticker`/`market_tickers` and `market_id`/`market_ids`
      - Updates sent whenever any ticker field changes

      **Use case:** Displaying current market prices and statistics
    messages:
      ticker:
        $ref: '#/components/messages/ticker'

  trade:
    address: trade
    title: Public Trades
    description: |
      Public trade notifications when trades occur.

      **Requirements:**
      - No additional channel-level authentication beyond the authenticated WebSocket connection
      - Market specification optional (omit to receive all trades)
      - Updates sent immediately after trade execution

      **Use case:** Trade feed, volume analysis
    messages:
      trade:
        $ref: '#/components/messages/trade'

  fill:
    address: fill
    title: User Fills
    description: |
      Your order fill notifications. Requires authentication.

      **Requirements:**
      - Authentication required
      - Market specification optional via `market_ticker`/`market_tickers` (omit to receive all your fills)
      - Supports `update_subscription` with `add_markets` / `delete_markets`
      - Updates sent immediately when your orders are filled

      **Use case:** Tracking your trading activity
    messages:
      fill:
        $ref: '#/components/messages/fill'

  market_positions:
    address: market_positions
    title: Market Positions
    description: |
      Real-time updates of your positions in markets. Requires authentication.

      **Requirements:**
      - Authentication required
      - Market specification optional (omit to receive all positions)
      - Filters are by `market_ticker`/`market_tickers` only; `market_id`/`market_ids` are not supported
      - Updates sent when your position changes due to trades, settlements, etc.

      **Monetary Values:**
      All monetary values are returned as fixed-point dollar strings (`_dollars` suffix).

      **Use case:** Portfolio tracking, position monitoring, P&L calculations
    messages:
      marketPosition:
        $ref: '#/components/messages/marketPosition'

  market_lifecycle_v2:
    address: market_lifecycle_v2
    title: Market & Event Lifecycle
    description: |
      Market state changes and event creation notifications.

      **Requirements:**
      - No additional channel-level authentication beyond the authenticated WebSocket connection
      - Receives all market and event lifecycle notifications (`market_ticker` filters are not supported)
      - Event creation notifications

      **Use case:** Tracking market lifecycle including creation, de(activation), close date changes, determination, settlement, price level structure changes, and metadata updates
    messages:
      marketLifecycleV2:
        $ref: '#/components/messages/marketLifecycleV2'
      marketMetadataUpdated:
        $ref: '#/components/messages/marketMetadataUpdated'
      eventLifecycle:
        $ref: '#/components/messages/eventLifecycle'
      eventFeeUpdate:
        $ref: '#/components/messages/eventFeeUpdate'

  multivariate_market_lifecycle:
    address: multivariate_market_lifecycle
    title: Multivariate Market & Event Lifecycle
    description: |
      Multivariate event (MVE) market state changes and event creation notifications.

      **Requirements:**
      - No additional channel-level authentication beyond the authenticated WebSocket connection
      - Receives all multivariate market lifecycle notifications (`market_ticker` filters are not supported)
      - Only emits lifecycle updates for multivariate events
      - Event creation notifications

      **Use case:** Tracking multivariate market lifecycle including creation, de(activation), close date changes, determination, settlement
    messages:
      multivariateMarketLifecycle:
        $ref: '#/components/messages/multivariateMarketLifecycle'
      eventLifecycle:
        $ref: '#/components/messages/eventLifecycle'

  communications:
    address: communications
    title: Communications
    description: |
      Real-time Request for Quote (RFQ) and quote notifications. Requires authentication.

      **Requirements:**
      - Authentication required
      - Market specification ignored
      - Optional sharding for fanout control:
        - `shard_factor` (1-100) and `shard_key` (`0 <= key < shard_factor`)
      - RFQ events (RFQCreated, RFQDeleted) are sent for all users by default. Set `user_filter: "self"` to receive only RFQs you created. Omitted or empty `user_filter` keeps the default.
      - Quote events (QuoteCreated, QuoteAccepted, QuoteExecuted) are only sent if you created the quote OR you created the RFQ

      **Use case:** Tracking RFQs you create and quotes on your RFQs, or quotes you create on others' RFQs. Use QuoteExecuted to correlate fill messages with quotes via client_order_id.
    messages:
      rfqCreated:
        $ref: '#/components/messages/rfqCreated'
      rfqDeleted:
        $ref: '#/components/messages/rfqDeleted'
      quoteCreated:
        $ref: '#/components/messages/quoteCreated'
      quoteAccepted:
        $ref: '#/components/messages/quoteAccepted'
      quoteExecuted:
        $ref: '#/components/messages/quoteExecuted'

  order_group_updates:
    address: order_group_updates
    title: Order Group Updates
    description: |
      Real-time order group lifecycle and limit updates. Requires authentication.

      **Requirements:**
      - Authentication required
      - Market specification ignored
      - Updates sent when order groups are created, triggered, reset, deleted, or have limits updated

      **Use case:** Tracking order group lifecycle and limits
    messages:
      orderGroupUpdates:
        $ref: '#/components/messages/orderGroupUpdates'

  user_orders:
    address: user_orders
    title: User Orders
    description: |
      Real-time order created and updated notifications. Requires authentication.

      **Requirements:**
      - Authentication required
      - Market specification optional via `market_tickers` (omit to receive all orders)
      - Supports `update_subscription` with `add_markets` / `delete_markets` actions
      - Updates sent when your orders are created, filled, canceled, or otherwise updated

      **Use case:** Tracking your resting orders, fills, and cancellations in real time
    messages:
      userOrder:
        $ref: '#/components/messages/userOrder'

  cfbenchmarks_value:
    address: cfbenchmarks_value
    title: CF Benchmarks Value Feed
    description: |
      Real-time CF Benchmarks index value updates, each carrying the raw upstream frame plus trailing 60-second and quarter-hour final-minute averages. Requires authentication.

      ## Coins and index IDs

      Use the following CF Benchmarks index IDs to request coin data on this channel or through the [REST passthrough](/cfbenchmarks/rest-passthrough). The BTC and ETH examples on this page are illustrative; they are not the full list of coins.

      | Coin | CF Benchmarks index ID |
      |------|------------------------|
      | AAVE | `AAVEUSD_RTI` |
      | ADA | `ADAUSD_RTI` |
      | BCH | `BCHUSD_RTI` |
      | BNB | `BNBUSD_RTI` |
      | BTC | `BRTI` |
      | DOGE | `DOGEUSD_RTI` |
      | DOT | `DOTUSD_RTI` |
      | ETH | `ETHUSD_RTI` |
      | HBAR | `HBARUSD_RTI` |
      | HYPE | `HYPEUSD_RTI` |
      | LINK | `LINKUSD_RTI` |
      | LTC | `LTCUSD_RTI` |
      | NEAR | `NEARUSD_RTI` |
      | SHIB / kSHIB | `SHIBUSD_RTI` |
      | SOL | `SOLUSD_RTI` |
      | SUI | `SUIUSD_RTI` |
      | VVV | `VVVUSD_RTI` |
      | WLD | `WLDUSD_RTI` |
      | XLM | `XLMUSD_RTI` |
      | XRP | `XRPUSD_RTI` |
      | ZEC | `ZECUSD_RTI` |

      Pass the index ID exactly as shown, rather than a coin symbol or Kalshi market ticker. For kSHIB, request `SHIBUSD_RTI`: values are USD per SHIB and are not scaled to kSHIB or a perpetual contract size.

      Use the `indexlist` action below to check the index IDs available on your WebSocket connection. Availability can change; this table is a coin-to-index reference, not a guarantee that every index is streaming in every environment.

      The [5Hz feed](/websockets/cfbenchmarks-value-5hz) has a smaller coin set: BTC, ETH, SOL, XRP, and DOGE. Use `cfbenchmarks_value` for the other coins above.

      ## Requirements

      - Authentication required
      - Index specification via `index_ids` (array of CF Benchmarks index IDs, for example `["BRTI", "ETHUSD_RTI"]`)
      - `market_ticker`/`market_tickers`/`market_id`/`market_ids` are not supported for this channel
      - You can seed `index_ids` in the initial subscribe, or subscribe first and add indices later
      - Use `index_ids: ["all"]` to receive every available index
      - Supports `update_subscription` with `subscribe_indices` / `unsubscribe_indices` / `indexlist` actions
      - `indexlist` returns the available index IDs (as a `cfbenchmarks_value_indexlist` message) without modifying the subscription
      - Ticks are emitted roughly once per second; duplicate or out-of-order upstream source timestamps are ignored. For up to 5 updates per second on supported indices, see the [CF Benchmarks 5Hz Value Feed](/websockets/cfbenchmarks-value-5hz) sibling channel

      **Use case:** Consuming CF Benchmarks reference index values and their short-window averages

      ## Subscription workflow

      1. Subscribe to `cfbenchmarks_value` (optionally seeding `index_ids`). A successful subscribe returns a `subscribed` response with the assigned `sid`.
      2. Discover available index IDs with the `indexlist` action; the server replies with a `cfbenchmarks_value_indexlist` message.
      3. Add or remove tracked index IDs with `subscribe_indices` / `unsubscribe_indices`, or use `index_ids: ["all"]` to track everything.

      For example, subscribe to BNB, HYPE, and SHIB values:

      ```json
      {
        "id": 1,
        "cmd": "subscribe",
        "params": {
          "channels": ["cfbenchmarks_value"],
          "index_ids": ["BNBUSD_RTI", "HYPEUSD_RTI", "SHIBUSD_RTI"]
        }
      }
      ```

      To discover the available indices, send the following after the `subscribed` response. Replace `sid: 1` with the subscription ID returned by the server:

      ```json
      {
        "id": 2,
        "cmd": "update_subscription",
        "params": {
          "sid": 1,
          "action": "indexlist"
        }
      }
      ```

      Read the available IDs from `msg.index_ids` in the `cfbenchmarks_value_indexlist` response. This lists the channel's available indices without changing which ones you subscribe to. A successful `subscribe` response alone does not confirm that a requested index is available.

      ## Averaging semantics

      `avg_60s_data` (always present):
      - Window is trailing and per tick: `[source_ts_ms - 60000, source_ts_ms)`
      - `window_size` counts prior ticks only
      - If there are no prior ticks in the trailing window, the average falls back to the current tick value

      `last_60s_windowed_average_15min` (present only in the final minute before quarter-hour close: `:00`, `:15`, `:30`, `:45`):
      - Active accumulation window is `(quarter_close_ts_ms - 60000, quarter_close_ts_ms]`
      - The start-boundary tick is excluded and the close tick is included
      - This produces second-indexed counts: `:01 -> 1`, `:14 -> 14`, `:59 -> 59`, close tick (`:00/:15/:30/:45`) -> `60`
      - The field is omitted outside that final-minute window

      ## Integration notes

      - If you subscribe without any `index_ids`, no value events flow until you add indices or switch to `["all"]`
      - `sid` identifies the subscription stream; use it for `update_subscription` and `unsubscribe`
      - Missing `index_ids` for `subscribe_indices`/`unsubscribe_indices` returns an `error` with `code: 24` ("Index IDs required"); unsupported actions return a standard websocket `error`
      - This channel is real-time only. Historical index values — including intra-second granularity on some indices — are available over REST via the [CF Benchmarks REST Passthrough](/cfbenchmarks/rest-passthrough); live intra-second updates are available on the [`cfbenchmarks_value_5hz`](/websockets/cfbenchmarks-value-5hz) channel
    messages:
      cfbenchmarksValue:
        $ref: '#/components/messages/cfbenchmarksValue'
      cfbenchmarksIndexList:
        $ref: '#/components/messages/cfbenchmarksIndexList'

  cfbenchmarks_value_5hz:
    address: cfbenchmarks_value_5hz
    title: CF Benchmarks 5Hz Value Feed
    description: |
      Real-time CF Benchmarks index value updates at up to 5 updates per second, each carrying the raw upstream frame plus parsed value fields. Requires authentication.

      This is the high-frequency sibling of the once-per-second [`cfbenchmarks_value`](/websockets/cfbenchmarks-value) channel. It carries BTC (`BRTI`), ETH (`ETHUSD_RTI`), SOL (`SOLUSD_RTI`), XRP (`XRPUSD_RTI`), and DOGE (`DOGEUSD_RTI`) at up to five updates per second. For BNB, HYPE, NEAR, ZEC, SUI, BCH, LTC, LINK, SHIB/kSHIB, ADA, WLD, AAVE, VVV, and other per-second indices, see the [coin and index ID table](/websockets/cfbenchmarks-value#coins-and-index-ids). Use this channel's `indexlist` action to discover its available IDs. Messages are lean raw ticks — they do not include the 60-second or quarter-hour averages, which stay on the per-second channel.

      **Requirements:**
      - Authentication required
      - Index specification via `index_ids` (array of CF Benchmarks index IDs, for example `["BRTI", "ETHUSD_RTI"]`)
      - `market_ticker`/`market_tickers`/`market_id`/`market_ids` are not supported for this channel
      - You can seed `index_ids` in the initial subscribe, or subscribe first and add indices later
      - Use `index_ids: ["all"]` to receive every index available on this channel
      - Supports `update_subscription` with `subscribe_indices` / `unsubscribe_indices` / `indexlist` actions
      - `indexlist` returns the index IDs recently observed on this channel's stream (as a `cfbenchmarks_value_5hz_indexlist` message) without modifying the subscription
      - Up to 5 ticks per second per index; duplicate or out-of-order upstream source timestamps are ignored

      **Use case:** Consuming CF Benchmarks reference index values at the vendor's full publication rate

      **Subscription workflow:**
      1. Subscribe to `cfbenchmarks_value_5hz` (optionally seeding `index_ids`). A successful subscribe returns a `subscribed` response with the assigned `sid`.
      2. Discover the streaming index IDs with the `indexlist` action; the server replies with a `cfbenchmarks_value_5hz_indexlist` message.
      3. Add or remove tracked index IDs with `subscribe_indices` / `unsubscribe_indices`, or use `index_ids: ["all"]` to track everything on this channel.

      **Integration notes:**
      - If you subscribe without any `index_ids`, no value events flow until you add indices or switch to `["all"]`
      - `sid` identifies the subscription stream; use it for `update_subscription` and `unsubscribe`
      - Missing `index_ids` for `subscribe_indices`/`unsubscribe_indices` returns an `error` with `code: 24` ("Index IDs required"); unsupported actions return a standard websocket `error`
      - Historical index values — including intra-second granularity — are available over REST via the [CF Benchmarks REST Passthrough](/cfbenchmarks/rest-passthrough)
    messages:
      cfbenchmarksValue5Hz:
        $ref: '#/components/messages/cfbenchmarksValue5Hz'
      cfbenchmarks5HzIndexList:
        $ref: '#/components/messages/cfbenchmarks5HzIndexList'

  pyth_value:
    address: pyth_value
    title: Pyth Value Feed
    description: |
      Real-time Pyth price updates for configured underlying tickers. Requires authentication.

      ## Access and pricing

      The Pyth data feed costs **$1,000/month**, with the **first seven days free**. [Subscribe to the Pyth data feed](https://buy.stripe.com/eVqaEXfmu9eN2ZB8gr4ZG0a).

      Connect using an authenticated Kalshi WebSocket session. See [Quick Start: WebSockets](/getting_started/quick_start_websockets#authentication) for API key authentication and request signing.

      ## Commodities and underlying tickers

      The reference table below includes spot metals, commodity futures, and indices. The gold and silver examples are only a subset of the feed coverage.

      | Pyth feed ID | Pyth symbol | Description |
      |--------------|-------------|-------------|
      | 345 | `Metal.XAG/USD` | Silver price in USD |
      | 346 | `Metal.XAU/USD` | Gold price in USD |
      | 2937 | `Commodities.CCU6/USD` | Cocoa futures (Sept 2026) in USD |
      | 3052 | `Commodities.COU6/USD` | Crude Oil futures (Sept 2026) in USD |
      | 3053 | `Commodities.COZ6/USD` | Crude Oil futures (Dec 2026) in USD |
      | 3080 | `Commodities.WHU6/USD` | Wheat futures (Sept 2026) in USD |
      | 3081 | `Commodities.WHZ6/USD` | Wheat futures (Dec 2026) in USD |
      | 3085 | `Commodities.SOU6/USD` | Soybeans futures (Sept 2026) in USD |
      | 3086 | `Commodities.SOX6/USD` | Soybeans futures (Nov 2026) in USD |
      | 3063 | `Commodities.Index.PYTHOIL/USD` | Blended Oil Index in USD |
      | 3153 | `Metal.Index.GOLD/USD` | Blended Gold Index in USD |
      | 3154 | `Metal.Index.SILVER/USD` | Blended Silver Index in USD |
      | 3045 | `Commodities.BRENTX6/USD` | Brent Crude futures (Nov 2026) in USD |
      | 3525 | `Commodities.Index.CU/USD` | Copper Index in USD |
      | 3265 | `Commodities.Index.NATGAS/USD` | Natural Gas Index in USD |
      | 3446 | `Commodities.Index.BRENT/USD` | Blended Brent Crude Index in USD |
      | 1781 | `Metal.XPT/USD` | Platinum price in USD |
      | 1780 | `Metal.XPD/USD` | Palladium price in USD |

      Pass the exact **Pyth symbol** in `underlying_tickers`. The numeric Pyth feed IDs are reference information and are not subscription parameters for this channel. Kalshi market tickers are not Pyth underlying tickers.

      Use `underlying_list` to discover recently streamed tickers on your connection. Availability can change, including as futures contracts expire; the table does not guarantee that every feed is streaming in every environment.

      ## Requirements

      - Authentication required
      - Seed `underlying_tickers` in the initial subscribe, or add them later
      - Use `underlying_tickers: ["all"]` to receive every available underlying
      - Supports `update_subscription` with `subscribe_underlyings`, `unsubscribe_underlyings`, and `underlying_list` actions
      - Duplicate and out-of-order source timestamps are ignored independently per underlying ticker

      ## Subscription workflow

      Subscribe to `pyth_value` with the underlying tickers you want to receive. For example, request gold, oil, and natural gas prices:

      ```json
      {
        "id": 1,
        "cmd": "subscribe",
        "params": {
          "channels": ["pyth_value"],
          "underlying_tickers": [
            "Metal.XAU/USD",
            "Commodities.Index.PYTHOIL/USD",
            "Commodities.Index.NATGAS/USD"
          ]
        }
      }
      ```

      A successful subscribe returns a `subscribed` response with the assigned `sid`. Use that subscription ID in subsequent commands; replace `sid: 1` in the examples below with the returned ID.

      You can also omit `underlying_tickers` to create an empty subscription, discover tickers, and add them later. An empty subscription sends no price updates until you add tickers or switch to `["all"]`.

      ### Discover recently streamed tickers

      ```json
      {
        "id": 2,
        "cmd": "update_subscription",
        "params": {
          "sid": 1,
          "action": "underlying_list"
        }
      }
      ```

      Read `msg.underlying_tickers` in the `pyth_value_underlying_list` response. This lists tickers observed on the stream within the last two hours without changing your subscription. It is not a complete catalog: inactive feeds can be absent. A successful subscribe response alone does not confirm that a requested ticker is streaming.

      ### Add or remove tickers

      Add platinum to the existing subscription:

      ```json
      {
        "id": 3,
        "cmd": "update_subscription",
        "params": {
          "sid": 1,
          "action": "subscribe_underlyings",
          "underlying_tickers": ["Metal.XPT/USD"]
        }
      }
      ```

      Remove platinum from the subscription:

      ```json
      {
        "id": 4,
        "cmd": "update_subscription",
        "params": {
          "sid": 1,
          "action": "unsubscribe_underlyings",
          "underlying_tickers": ["Metal.XPT/USD"]
        }
      }
      ```

      ### Receive all available underlyings

      Set `underlying_tickers` to `["all"]` in the initial subscribe, or enable it on an existing subscription:

      ```json
      {
        "id": 5,
        "cmd": "update_subscription",
        "params": {
          "sid": 1,
          "action": "subscribe_underlyings",
          "underlying_tickers": ["all"]
        }
      }
      ```

      While all-mode is enabled, removing an individual ticker does not exclude it. Send `unsubscribe_underlyings` with `["all"]` to disable all-mode; any explicitly subscribed tickers remain selected.

      ## Integration notes

      - `sid` identifies the subscription stream; use it for `update_subscription` and `unsubscribe`.
      - Missing or empty `underlying_tickers` for `subscribe_underlyings` or `unsubscribe_underlyings` returns an `error` with `code: 28` ("Underlying tickers required").
      - `value_usd` is a USD price string formatted to eight decimal places.
      - `source_ts_ms` is the source timestamp in Unix milliseconds; `received_at` is when Kalshi received the update, also in Unix milliseconds.
    messages:
      pythValue:
        $ref: '#/components/messages/pythValue'
      pythUnderlyingList:
        $ref: '#/components/messages/pythUnderlyingList'

