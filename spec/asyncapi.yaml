    marketLifecycleV2Payload:
      type: object
      required: ["type", "sid", "seq", "msg"]
      properties:
        type:
          type: string
          const: "market_lifecycle_v2"
        sid:
          $ref: '#/components/schemas/subscriptionId'
        seq:
          $ref: '#/components/schemas/sequenceNumber'
        msg:
          type: object
          required: ["market_ticker", "event_type"]
          properties:
            market_ticker:
              $ref: '#/components/schemas/marketTicker'
              description: Unique identifier for markets. This is what you use to differentiate updates for different markets
            exchange_index:
              type: integer
              description: Optional - This key will ONLY exist when the market is created. Identifier for the exchange shard the market lives on
            open_ts:
              type: integer
              description: Optional - This key will ONLY exist when the market is created. Unix timestamp for when the market opened (in seconds)
              format: int64
            close_ts:
              type: integer
              description: Optional - This key will ONLY exist when the market is created OR when the close date is updated. Unix timestamp for when the market is scheduled to close (in seconds). Will be updated in case of early determination markets
              format: int64
            determination_ts:
              type: integer
              description: Optional - This key will ONLY exist when the market is determined. Unix timestamp for when the market is determined (in seconds)
              format: int64
            settled_ts:
              type: integer
              description: Optional - This key will ONLY exist when the market is settled. Unix timestamp for when the market is settled (in seconds)
              format: int64
            result:
              type: string
              description: Optional - This key will ONLY exist when the market is determined. Result of the market
            settlement_value:
              type: string
              description: Optional - This key will ONLY exist when the market is determined. Settlement value of the market in fixed-point dollars (e.g. "0.5000")
            is_deactivated:
              type: boolean
              description: Optional - This key will ONLY exist when the market is paused/unpaused. Boolean flag to indicate if trading is paused on an open market. This should only be interpreted for an open market
            additional_metadata:
              $ref: '#/components/schemas/lifecycleAdditionalMetadata'
              description: Optional - This key will be emitted when the market is created
            event_type:
              type: string
              description: |
                Field to annotate which of the event type this event is for:
                - `created` - Market created
                - `activated` - Market activated
                - `deactivated` - Market deactivated
                - `close_date_updated` - Market close date updated
                - `determined` - Market determined
                - `settled` - Market settled
                - `price_level_structure_updated` - Market price level structure changed
              enum: ["created", "deactivated", "activated", "close_date_updated", "determined", "settled", "price_level_structure_updated"]
            price_level_structure:
              $ref: '#/components/schemas/lifecyclePriceLevelStructure'
              description: Optional - The market price level structure on creation or price_level_structure_updated events
            price_ranges:
              type: array
              description: Optional - Emitted alongside price_level_structure (on market creation and price_level_structure_updated events). The valid price bands for the market, in fixed-point dollars. Use this to determine valid order prices rather than hardcoding a tick size.
              items:
                type: object
                required:
                  - start
                  - end
                  - step
                properties:
                  start:
                    type: string
                    description: Starting price for this band, in dollars
                  end:
                    type: string
                    description: Ending price for this band, in dollars
                  step:
                    type: string
                    description: Tick size (minimum price increment) within this band, in dollars

