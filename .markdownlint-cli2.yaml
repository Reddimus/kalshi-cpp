config:
  default: true
  # Long lines and inline HTML are fine in prose and tables.
  MD013: false
  MD033: false
  MD060: false
  # A literal "+" at the start of a wrapped line is not a list marker.
  MD004: false
  MD024:
    siblings_only: true
globs:
  - "**/*.md"
ignores:
  - "**/build*/**"
  - "**/_deps/**"
  - ".git/**"
  # GitHub renders this template inside a PR body that already has a title.
  - ".github/pull_request_template.md"
