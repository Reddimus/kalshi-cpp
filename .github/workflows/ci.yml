name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CTEST_OUTPUT_ON_FAILURE: "1"
  UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential ninja-build \
            pkg-config clang-format-18 python3-yaml libcurl4-openssl-dev libssl-dev \
            libwebsockets-dev
      - name: Lint
        run: make lint CLANG_FORMAT=clang-format-18
      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: linux-release
      - name: Build
        run: >-
          make build CMAKE_ARGS="-G Ninja -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DKALSHI_WARNINGS_AS_ERRORS=ON -DKALSHI_BUILD_BENCHMARKS=ON"
      - name: Test
        run: make test
      # One iteration each, so a benchmark whose setup breaks fails here.
      # Timings are never checked.
      - name: Benchmark smoke run
        run: |
          ./build/benchmarks/kalshi_benchmarks --benchmark_dry_run=true \
            --benchmark_out=build/benchmarks.json --benchmark_out_format=json
          if grep -q '"error_occurred": true' build/benchmarks.json; then
            echo "A benchmark failed; see its ERROR OCCURRED line above."
            exit 1
          fi

  build-macos:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: |
          brew install ninja pkg-config libwebsockets
          echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig:$(brew --prefix libwebsockets)/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: macos-release
      - name: Build
        run: >-
          make build CMAKE_ARGS="-G Ninja -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DKALSHI_WARNINGS_AS_ERRORS=ON"
      - name: Test
        run: make test

  # Builds against the Glaze release that vcpkg and Conan ship, so the minimum
  # supported version stays tested alongside the FetchContent pin.
  build-windows:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\.vcpkg-cache,readwrite
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: vcpkg-cache
        with:
          path: .vcpkg-cache
          key: vcpkg-windows-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-windows-
      - name: Configure
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .vcpkg-cache | Out-Null
          # vcpkg reads port versions from its working tree, which can be older
          # than the manifest baseline. Update it; the baseline still pins versions.
          git -C "$env:VCPKG_INSTALLATION_ROOT" fetch --quiet origin master
          git -C "$env:VCPKG_INSTALLATION_ROOT" reset --quiet --hard origin/master
          & "$env:VCPKG_INSTALLATION_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          cmake -S . -B build `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DKALSHI_USE_SYSTEM_GLAZE=ON `
            -DKALSHI_WARNINGS_AS_ERRORS=ON
      # Save right after vcpkg installs, so a later build or test failure
      # does not discard the dependency binaries.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        with:
          path: .vcpkg-cache
          key: vcpkg-windows-${{ hashFiles('vcpkg.json') }}
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --parallel 4

  sanitizer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential ninja-build \
            pkg-config libcurl4-openssl-dev libssl-dev libwebsockets-dev
      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: linux-asan
      - name: ASan and UBSan
        run: make sanitize CMAKE_ARGS="-G Ninja -DCMAKE_CXX_COMPILER_LAUNCHER=ccache"

  tsan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential ninja-build \
            pkg-config libcurl4-openssl-dev libssl-dev libwebsockets-dev
      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: linux-tsan
      # TSan cannot map its shadow memory with the runner kernel's default ASLR entropy.
      - name: Lower ASLR entropy
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: ThreadSanitizer
        run: make tsan CMAKE_ARGS="-G Ninja -DCMAKE_CXX_COMPILER_LAUNCHER=ccache"

  clang-tidy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential ninja-build \
            clang-18 clang-tidy-18 libc++-18-dev libc++abi-18-dev pkg-config \
            libcurl4-openssl-dev libssl-dev libwebsockets-dev
      - name: Build with clang-tidy
        # libc++ provides std::expected to clang 18; libstdc++ 13 hides it.
        run: >-
          make tidy CMAKE_ARGS="-G Ninja -DCMAKE_CXX_COMPILER=clang++-18
          -DCMAKE_CXX_FLAGS=-stdlib=libc++"

  consumer-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config \
            libcurl4-openssl-dev libssl-dev libwebsockets-dev
      - run: make consumers

  markdown-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
