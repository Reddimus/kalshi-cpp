name: Release

# Publishes a GitHub release when a vX.Y.Z tag is pushed. The notes are the
# matching CHANGELOG.md section.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  actions: write # dispatch CI when the tagged commit has no run yet
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the tag matches the CMake project version
        run: |
          version="${GITHUB_REF_NAME#v}"
          cmake_version=$(./tools/project_version.sh)
          if [ "$cmake_version" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match CMakeLists.txt VERSION $cmake_version"
            exit 1
          fi

      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no [$version] section"
            exit 1
          fi

      - name: Require passing CI on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Uses the newest CI run for this commit from any event. A commit
          # that never ran CI (for example, not the head of a push) gets one.
          dispatched=false
          for _ in $(seq 1 90); do
            state=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
              --commit "$GITHUB_SHA" --json status,conclusion \
              --jq '.[0] | "\(.status) \(.conclusion)"')
            case "$state" in
              "completed success") echo "CI passed for $GITHUB_SHA"; exit 0 ;;
              completed*) echo "::error::CI did not pass for $GITHUB_SHA: $state"; exit 1 ;;
              "")
                if [ "$dispatched" = false ]; then
                  gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
                  dispatched=true
                fi ;;
            esac
            echo "CI state: ${state:-not started}"
            sleep 30
          done
          echo "::error::timed out waiting for CI"
          exit 1

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME"
          --notes-file "$RUNNER_TEMP/notes.md" --verify-tag

      # Events from this workflow's token start no other workflows, except a
      # dispatch, so the docs deploy is requested explicitly.
      - name: Publish the API reference
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
