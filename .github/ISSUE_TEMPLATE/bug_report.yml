name: Bug report
description: A crash, wrong result, or other incorrect behavior.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected, what happened instead, and any error text or backtrace.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The smallest code or steps that trigger it. Remove credentials and account data.
      placeholder: |
        1. Build with `make build`
        2. Run `./build/examples/example_<name>`
        3. See ...
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      placeholder: |
        - kalshi-cpp: vX.Y.Z or commit
        - OS and compiler: e.g. Ubuntu 24.04, GCC 13.3
        - CMake, OpenSSL, libcurl, libwebsockets versions
    validations:
      required: true
  - type: markdown
    attributes:
      value: >-
        Security issue? Report it privately through
        [the security policy](https://github.com/Reddimus/kalshi-cpp/security/policy) instead.
