name: Feature request
description: Suggest an API, endpoint, or usability improvement.
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What would you like?
      description: The API or behavior you want and the code it would let you write.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today?
      description: Any workaround you use now.
  - type: textarea
    id: context
    attributes:
      label: Links
      description: Kalshi API docs, related issues, or examples.
